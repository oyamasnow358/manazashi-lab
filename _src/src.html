<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>まなざし ラボ｜MieeL</title>
<link rel="apple-touch-icon" id="touchIcon" href="">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%80%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #F1F3FA; --card: #fff; --ink: #1F2937; --sub: #667085; --line: #DCE1EE; --main: #4C6EF5; --main-d: #3B5BDB; --go: #2F9E44; --go-d: #237A34;
    --red: #E03131; --or: #F08C00; --teal: #0CA678; --vio: #7048E8;
    --c1: #4C6EF5; --c2: #F08C00; --c3: #0CA678; --c4: #E64980;
    --mieel: radial-gradient(circle at 50% 0%,#1B8FE8 0%,#2BB8D6 28%,#3FCB9E 45%,#8FD24A 58%,#F4D027 72%,#F7941E 100%);
    --emoji: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: "Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",system-ui,sans-serif; font-weight: 600;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; overscroll-behavior: none;
    display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  input, select, textarea { font: inherit; -webkit-user-select: text; user-select: text; }
  .emo { font-family: var(--emoji); font-weight: 400; line-height: 1; }
  [hidden] { display: none !important; }
  .topbar { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 14px; min-height: 56px; }
  .brand { flex: 1; display: flex; justify-content: center; align-items: center; gap: 12px; color: #5C6B9C; font-size: 15px; letter-spacing: .06em; min-width: 0; }
  .mieel-brand { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .orb-mini { width: 22px; height: 22px; border-radius: 50%; background: var(--mieel); flex: none; }
  .mieel-brand strong { font-size: 16px; color: var(--ink); }
  .mieel-brand .url { font-size: 12px; color: var(--sub); font-weight: 600; }
  @media (max-width: 699px) { .topbar .url, .topbar .appname { display: none; } }
  .tbtn { height: 46px; min-width: 46px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--line); background: #fff; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 16px 14px; }
  body.playing .topbar { display: none; } body.playing main { padding: 0; }
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { transform: scale(.5); opacity: 0; } 70% { transform: scale(1.06); } 100% { transform: none; opacity: 1; } }
  .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .big-btn { min-height: 64px; padding: 0 26px; border: none; border-radius: 999px; color: #fff; font-size: clamp(18px, 2.4vw, 24px); display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--main); box-shadow: 0 6px 0 var(--main-d); }
  .big-btn.go { background: var(--go); box-shadow: 0 6px 0 var(--go-d); }
  .big-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .big-btn:disabled { opacity: .45; }
  .pill { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid var(--line); background: #fff; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .pill:active { transform: translateY(2px); }
  .pill.on { border-color: var(--main); background: #EDF2FF; color: var(--main-d); }
  .pill.danger { color: var(--red); border-color: #FFC9C9; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .help { color: var(--sub); font-weight: 500; font-size: 14px; line-height: 1.7; margin: 0; }
  h2.t { margin: 0; font-size: clamp(20px, 2.6vw, 26px); }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 16px; }

  /* ホーム */
  .home { gap: 14px; }
  .kids { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .kid { min-height: 52px; padding: 0 18px; border-radius: 16px; border: 3px solid var(--line); background: #fff; font-size: 18px; display: inline-flex; align-items: center; gap: 8px; }
  .kid.on { border-color: var(--main); background: #EDF2FF; }
  .kid.add { border-style: dashed; color: var(--main); }
  .tasks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 14px; }
  .tcard { position: relative; text-align: left; border: 3px solid var(--line); background: #fff; border-radius: 24px; padding: 16px; display: flex; gap: 14px; align-items: flex-start; box-shadow: 0 5px 0 rgba(0,0,0,.05); min-height: 120px; }
  .tcard:active { transform: translateY(4px); box-shadow: none; }
  .tcard .emo { font-size: 48px; flex: none; }
  .tcard b { font-size: 20px; display: block; }
  .tcard small { color: var(--sub); font-weight: 500; font-size: 13.5px; line-height: 1.6; display: block; margin-top: 4px; }
  .tcard .tag { position: absolute; right: 12px; top: 10px; font-size: 11px; padding: 2px 8px; border-radius: 8px; background: #EDF2FF; color: var(--main-d); }
  .calbadge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 14px; background: #fff; border: 2px solid var(--line); }
  .calbadge.good { border-color: #8CE99A; background: #EBFBEE; } .calbadge.ok { border-color: #FFE066; background: #FFF9DB; } .calbadge.poor { border-color: #FFA8A8; background: #FFF5F5; }

  /* 全画面の 課題 */
  .stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #FDFDFE; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage .quit { position: absolute; left: 12px; top: calc(10px + env(safe-area-inset-top)); z-index: 5; overflow: hidden; border: 2px solid #DEE2E6; background: rgba(255,255,255,.9); color: #868E96; font-size: 14px; padding: 8px 12px; border-radius: 999px; touch-action: none; opacity: .6; }
  .stage .quit i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #FFE3E3; } .stage .quit span { position: relative; }
  .stage .quit.pressing { opacity: 1; color: var(--red); } .stage .quit.pressing i { width: 100%; transition: width 1.5s linear; }
  .stage .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 20px; }
  .stage .center h2 { margin: 0; font-size: clamp(26px, 4vw, 40px); }
  .stage .center p { margin: 0; color: var(--sub); font-size: 18px; line-height: 1.7; max-width: 720px; }
  .stage .pv { position: absolute; right: 12px; bottom: 12px; width: 200px; aspect-ratio: 4/3; border-radius: 14px; overflow: hidden; border: 3px solid #fff; box-shadow: 0 6px 18px rgba(0,0,0,.18); background: #000; }
  .stage .pv video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .stage .pv .st { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; padding: 4px 8px; text-align: center; }
  .stage .dbg { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: #868E96; font-weight: 500; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-size: 18px; color: var(--sub); background: #FDFDFE; z-index: 6; padding: 20px; line-height: 1.7; }
  .loading .emo { font-size: 54px; display: block; }

  /* レポート */
  .rep { gap: 12px; }
  .rephead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .rephead h2 { flex: 1; margin: 0; font-size: clamp(20px, 2.6vw, 26px); }
  .slist { display: flex; flex-direction: column; gap: 8px; }
  .sitem { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #fff; border: 2px solid var(--line); text-align: left; }
  .sitem .emo { font-size: 30px; } .sitem b { font-size: 17px; } .sitem small { display: block; color: var(--sub); font-weight: 500; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .metric { background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: 12px 14px; }
  .metric .k { font-size: 13px; color: var(--sub); }
  .metric .v { font-size: 28px; font-weight: 800; margin-top: 2px; }
  .metric .v small { font-size: 14px; color: var(--sub); font-weight: 600; margin-left: 2px; }
  .metric .cmp { font-size: 12.5px; margin-top: 4px; color: var(--sub); }
  .metric .cmp b { color: var(--ink); }
  .section { display: flex; flex-direction: column; gap: 10px; }
  .section h3 { margin: 6px 0 0; font-size: 18px; }
  .chart { width: 100%; height: 220px; display: block; background: #fff; border: 2px solid var(--line); border-radius: 18px; }
  .note { background: #FFF9DB; border: 2px solid #FFE066; border-radius: 16px; padding: 10px 14px; font-size: 14px; line-height: 1.7; font-weight: 500; }
  .note.info { background: #EDF2FF; border-color: #BAC8FF; }
  textarea.memo { width: 100%; min-height: 90px; border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: 15px; font-weight: 500; resize: vertical; }
  .heat { position: relative; width: min(100%, 720px); border-radius: 16px; overflow: hidden; border: 2px solid var(--line); background: #fff; }
  .heat img, .heat canvas { display: block; width: 100%; }
  .heat canvas { position: absolute; inset: 0; height: 100%; }
  table.t { border-collapse: collapse; font-size: 14px; } table.t td, table.t th { border: 1px solid var(--line); padding: 6px 10px; text-align: center; font-weight: 600; } table.t th { background: #F8F9FC; color: var(--sub); font-size: 12.5px; }

  /* モーダル */
  .modal { position: fixed; inset: 0; z-index: 60; background: rgba(15,23,42,.45); display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal.open { display: flex; }
  .sheet { background: #fff; border-radius: 26px; width: min(780px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .shead { flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 2px solid #EEF2F7; }
  .shead h2 { flex: 1; margin: 0; font-size: 21px; }
  .tabs { display: flex; gap: 6px; padding: 10px 14px 0; flex-wrap: wrap; }
  .tabs button { height: 44px; padding: 0 14px; border-radius: 14px 14px 0 0; border: 2px solid var(--line); border-bottom: none; background: #F8FAFC; font-size: 15px; }
  .tabs button.on { background: #fff; color: var(--main-d); border-color: var(--main); }
  .sbody { flex: 1; overflow-y: auto; padding: 14px 18px 22px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
  .field { display: flex; flex-direction: column; gap: 4px; } .field input, .field select { height: 46px; border-radius: 12px; border: 2px solid var(--line); padding: 0 12px; font-size: 16px; }
  .seg { display: inline-flex; border: 2px solid var(--line); border-radius: 14px; overflow: hidden; flex-wrap: wrap; }
  .seg button { min-height: 42px; padding: 0 12px; border: none; background: #fff; font-size: 14.5px; border-right: 2px solid var(--line); }
  .seg button:last-child { border-right: none; } .seg button.on { background: var(--main); color: #fff; }
  .lic, .doc { font-size: 15px; font-weight: 500; line-height: 1.8; }
  .lic h3, .doc h3 { font-size: 17px; margin: 12px 0 4px; } .lic h3:first-child, .doc h3:first-child { margin-top: 0; }
  .lic p, .doc p { margin: 0 0 6px; } .lic a, .doc a { color: #1864AB; }
  .licitem { border: 2px solid #EEF2F7; border-radius: 14px; padding: 10px 14px; margin-bottom: 8px; }
  .lic pre { white-space: pre-wrap; font-size: 11px; line-height: 1.5; background: #F8F9FA; border-radius: 10px; padding: 10px; max-height: 320px; overflow-y: auto; -webkit-user-select: text; user-select: text; }
  .toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 80; background: #1F2937; color: #fff; padding: 12px 22px; border-radius: 999px; font-size: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: 92vw; text-align: center; }

  /* いんさつ（A4 たて） */
  @media print {
    @page { size: A4 portrait; margin: 12mm; }
    body { display: block; height: auto; overflow: visible; background: #fff; padding: 0; }
    .topbar, .noprint, .modal, .toast { display: none !important; }
    main { padding: 0; display: block; } .screen { display: block; animation: none; } .scroll { overflow: visible; }
    .metric, .chart, .card, .heat { break-inside: avoid; } .chart { border-color: #ccc; }
  }
</style>
</head>
<body>
<div class="topbar">
  <button class="tbtn" id="homeBtn" type="button" hidden>🏠 <span>ホーム</span></button>
  <div class="brand"><span class="mieel-brand"><span class="orb-mini"></span><strong>MieeL</strong><span class="url">www.mieel-support-school.com</span></span><span class="appname">まなざし ラボ</span></div>
  <button class="tbtn" id="menuBtn" type="button">⚙️ <span>メニュー</span></button>
</div>
<main id="main"></main>
